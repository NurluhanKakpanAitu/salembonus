# Әр push/PR-да: бэкендтің интеграциялық тесттері (шын PostgreSQL, Testcontainers) және SalemPos жинағы.
# main-ге push болғанда (немесе қолмен Run workflow) тесттер өтсе, серверге деплой жасайды.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Integration tests
        run: dotnet test backend/SalemBonus.Api.Tests --logger "console;verbosity=normal"

  pos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pos/package-lock.json
      - run: npm ci
        working-directory: pos
      - name: Typecheck and build
        run: npm run build
        working-directory: pos

  # Серверде бұл кілтке тек ./scripts/deploy.sh іске қосуға рұқсат бар (SERVER.md, 14-бөлім).
  deploy:
    needs: [backend, pos]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "::warning::SSH_HOST / SSH_KEY секреттері қойылмаған, деплой өткізілді"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh "${SSH_USER:-deploy}@$SSH_HOST" 'cd /opt/salembonus && ./scripts/deploy.sh'
