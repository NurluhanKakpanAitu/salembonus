# Әр push/PR-да: бэкендтің интеграциялық тесттері (шын PostgreSQL, Testcontainers) және SalemPos жинағы.
# main-ге push болғанда (немесе қолмен Run workflow) тесттер өтсе, образдар Docker Hub-қа жарияланады, сервер оларды өзі алады.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Integration tests
        run: dotnet test backend/SalemBonus.Api.Tests --logger "console;verbosity=normal"

  pos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pos/package-lock.json
      - run: npm ci
        working-directory: pos
      - name: Typecheck and build
        run: npm run build
        working-directory: pos

  # Образдар → Docker Hub (жеке репозиторий, vars.DOCKERHUB_IMAGE).
  # Серверге кіру керек емес: сервердегі /opt/infra/autodeploy минут сайын жаңа образды тексеріп, өзі жаңартады.
  publish:
    needs: [backend, pos]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DOCKERHUB_IMAGE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-${{ matrix.name }}
      cancel-in-progress: false
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: frontend
          - name: pos
            context: pos
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # <name>-main — сервер осыны алады; <name>-<sha> — қайтару (rollback) үшін
          tags: |
            ${{ vars.DOCKERHUB_IMAGE }}:${{ matrix.name }}-main
            ${{ vars.DOCKERHUB_IMAGE }}:${{ matrix.name }}-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
