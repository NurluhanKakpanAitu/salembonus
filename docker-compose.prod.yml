# Продакшн: база + API + SalemBonus фронты + SalemPos + Caddy (HTTPS), бәрі бір серверде.
# Іске қосу: docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: salembonus
      POSTGRES_USER: salembonus
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD керек}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salembonus -d salembonus"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Порт сыртқа шығарылмайды: базаға тек ішкі желіден кіріледі

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      PORT: "8080"
      ConnectionStrings__Default: Host=db;Port=5432;Database=salembonus;Username=salembonus;Password=${DB_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Jwt кілті керек}
      Cors__Origins__0: https://salembonus.kz
      Cors__Origins__1: https://www.salembonus.kz
      Auth__StaticOtpCode: ${STATIC_OTP_CODE:-}
      # SalemPos суреттері (Cloudflare R2). Токен тек salem-media бакетіне шектелген болсын.
      R2__AccountId: ${R2_ACCOUNT_ID:-}
      R2__Bucket: ${R2_BUCKET:-}
      R2__AccessKeyId: ${R2_ACCESS_KEY_ID:-}
      R2__SecretAccessKey: ${R2_SECRET_ACCESS_KEY:-}
      R2__PublicUrl: ${R2_PUBLIC_URL:-}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # .NET образында wget/curl жоқ — bash-тың /dev/tcp-сымен тексереміз.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q Healthy <&3"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"

  # SalemPos: salempos.kz. API-ге сол домендегі /api арқылы жүгінеді (cookie сол үшін бір доменде).
  pos-web:
    build: ./pos
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@salembonus.kz}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
      - pos-web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
