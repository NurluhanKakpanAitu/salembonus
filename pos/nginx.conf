server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Хэші бар файлдар мәңгі кэштеледі
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index кэштелмейді — жаңа нұсқа бірден жетеді
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA: кез келген жол index.html-ге түседі
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# admin.salemtech.kz — SalemTech әкімшілігі: сол статика, басқа бет (admin.html). Caddy/Traefik Host тақырыбын сақтап жібереді.
server {
    listen 80;
    server_name ~^admin.;
    root /usr/share/nginx/html;
    index admin.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /admin.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri /admin.html;
    }
}
